server {
    listen 443 ssl default_server;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/proseva.crt;
    ssl_certificate_key /etc/nginx/ssl/proseva.key;

    location / {
        return 404;  # or proxy_pass to something safe
    }
}

server {
    listen 443 ssl;
    server_name api-listing.proseva.net;

    ssl_certificate     /etc/nginx/ssl/proseva.crt;
    ssl_certificate_key /etc/nginx/ssl/proseva.key;

    location / {
        proxy_pass http://lisiting-microservice;
    }
}

server {
    listen 443 ssl;
    server_name keycloak.proseva.net;

    ssl_certificate     /etc/nginx/ssl/proseva.crt;
    ssl_certificate_key /etc/nginx/ssl/proseva.key;

    location / {
        proxy_pass http://infra-keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # critical for HTTPS awareness
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Optional WebSocket support (Keycloak Admin UI uses websockets sometimes)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
