services:
  auth:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: iam # Identity and Access Management (IAM)
    ports:
      - 8080:8080
    environment:
      KEYCLOAK_ADMIN: admin 
      KEYCLOAK_ADMIN_PASSWORD: admin
    command:
      - start-dev 
      - --import-realm
    volumes:
      - keycloak-data:/opt/keycloak/data/

volumes:
  keycloak-data:
