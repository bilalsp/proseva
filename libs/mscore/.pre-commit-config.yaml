repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev:  v4.5.0
    hooks:
    -   id: check-merge-conflict
    -   id: check-added-large-files
    -   id: check-json
    -   id: check-toml
    # -   id: no-commit-to-branch
    #     args: [--branch, main]
-   repo: https://github.com/python-poetry/poetry
    rev: '1.8'
    hooks:
    -   id: poetry-check
-   repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
    -   id: codespell
        name: spell checker
        exclude: 'poetry.lock'
# -   repo: local
#     hooks:
#     -   id: mypy
#         name: type checker
#         entry: poetry run mypy
#         language: system
#         types: [python]
#         pass_filenames: false
#         args: ['.']
-   repo: local
    hooks:
    -   id: ruff-linter
        name: linter
        entry: poetry run ruff check
        language: system
        types: [python]
    -   id: ruff-format
        name: formatter
        entry: poetry run ruff format --check
        language: system
        types: [python]
